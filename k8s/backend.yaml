apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 1 
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: proy-api:latest 
        imagePullPolicy: IfNotPresent 
        ports:
        - containerPort: 3001 
---
apiVersion: v1
kind: Service
metadata:
  name: api-service 
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 3005       
      targetPort: 3001 
  type: LoadBalancer